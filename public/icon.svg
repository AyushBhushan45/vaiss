<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="35%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#9A6A00" />
    </linearGradient>

    <!-- Dark Luxury Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#05080E" />
    </radialGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Inner Soft Golden Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="#EAB308" opacity="0.06" filter="url(#goldGlow)" />

  <!-- Book Pages Group -->
  <g transform="translate(256, 256) scale(1.4)" filter="url(#goldGlow)">
    <!-- Left Page -->
    <path 
      d="M-8 -42 C-35 -52, -75 -48, -92 -36 C-96 -33, -98 -28, -98 -22 L-98 42 C-98 47, -94 51, -89 50 C-74 46, -38 42, -8 52 Z" 
      fill="url(#goldGrad)" 
    />
    
    <!-- Right Page -->
    <path 
      d="M8 -42 C35 -52, 75 -48, 92 -36 C96 -33, 98 -28, 98 -22 L98 42 C98 47, 94 51, 89 50 C74 46, 38 42, 8 52 Z" 
      fill="url(#goldGrad)" 
    />

    <!-- Inner Page Cutouts for Depth -->
    <path 
      d="M-14 -32 C-38 -40, -70 -37, -84 -27 L-84 34 C-72 26, -42 24, -14 32 Z" 
      fill="#090D16" 
      opacity="0.9"
    />
    
    <path 
      d="M14 -32 C38 -40, 70 -37, 84 -27 L84 34 C72 26, 42 24, 14 32 Z" 
      fill="#090D16" 
      opacity="0.9"
    />

    <!-- Page Content Lines -->
    <line x1="-70" y1="-12" x2="-28" y2="-18" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <line x1="-70" y1="4" x2="-35" y2="-2" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <line x1="-70" y1="20" x2="-42" y2="15" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <line x1="28" y1="-18" x2="70" y2="-12" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <line x1="35" y1="-2" x2="70" y2="4" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <line x1="42" y1="15" x2="70" y2="20" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Center Book Spine Ribbon -->
    <path d="M0 -48 L0 54" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />

    <!-- Masterclass Sparkle Icon -->
    <path 
      d="M0 -64 L5 -52 L17 -47 L5 -42 L0 -30 L-5 -42 L-17 -47 L-5 -52 Z" 
      fill="url(#goldGrad)" 
    />
  </g>
</svg>
